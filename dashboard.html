<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        *{
            margin : 0;
            padding:0;
            box-sizing: border-box;
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            background-color: lightblue;
        }
        
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px 10px 50px;
            background-color: gray;       
        }
        a{
            text-decoration: none;
           
            color: white;
        }
        h1{
            color: white;
        }

    </style>
</head>
<body>
    <div class="wrapper">
    <header>
       <h1>Welcome to the Dashboard</h1>
        <nav>
            <a href="index.html">Logout</a>
         </nav>
    </header>
    <section>
        <table>
            <th>
                <h2>User Information</h2>
                <p id="displayName"></p>
                <p id="displayPassword"></p>
            </th>
            <tr>
                <td>Username:</td>
                <td id="showName"></td>
            </tr>
        </table>
    </section>
    </div>
    
</body>
</html>
