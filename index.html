<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <h1 class="heading">Login Form</h1>
    <div class="container">
       <form action="" >
        Username:<input type="text" name="username" id="username" placeholder="username" required="username"><br><br>
        password:<input type="password" name="password" id="password" placeholder="password" required="password" minlength=10><br><br>
        <button type="submit">Login</button>
        new account? <a href="signup.html">Sign up</a>
       </form>
    </div>
    <script>
        document.querySelector("form").addEventListener("submit",function(e){
            e.preventDefault();
            let username=document.getElementById("username").value;
            let password=document.getElementById("password").value;
            let storedUsername=localStorage.getItem("name");
            let storedPassword=localStorage.getItem("password");

            if(username===storedUsername && password===storedPassword){
                alert("Login successful");
            }else{
                alert("Invalid credentials");
            }
        });
    </script>
</body>
</html>
