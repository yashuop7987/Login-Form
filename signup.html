<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup form</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            width: 300px;
            height: auto;
            margin: auto;
            padding: 10px;
            border: 1px solid black; 
            background-color: lightcyan;
            justify-content: center; 
            align-items: center;

        }
        input{
            border-radius: 5px;
            height: 25px;
            width: 100px;
        }
        button{
            cursor: pointer;
            background-color: blue;
            color: white ;
            padding: 10px 5px 10px 5px;
            border-radius: 15px;
            font-size: medium;
            font-weight: bold;
        }
        button:hover{
            background-color: lightskyblue;
        }

        .heading{
            text-align: center;
            text-decoration: underline;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        a{
            text-decoration: none;
            color: white;
        }


    </style>
</head>
<body>
    <h1 class="heading">Sign Up</h1>
    <div class="container">
        <form action="">
            UserName: <input type="text" name="name" placeholder="name" required="name" id="name"><br><br>
            Email: <input type="text" name="email" placeholder="email" required="email" id="email"><br><br>
            Password: <input type="password" name="password" placeholder="password" required="password" minlength=10 id="password"><br><br>
            <button type="submit"><a href="index.html">Sign Up</a></button>
        </form>
        <script>
            const form = document.querySelector('form');
            form.addEventListener('submit', function(event) {
                event.preventDefault(); 

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Store data in localStorage
                localStorage.setItem('name', name);
                localStorage.setItem('email', email);
                localStorage.setItem('password', password);

                alert('Signup successful! Data stored in localStorage.');
                form.reset(); // Reset the form
            });
        </script>
    </div>
</body>
</html>
